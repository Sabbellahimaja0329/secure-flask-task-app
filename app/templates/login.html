{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h3>Login</h3>
<form method="post">
  {{ form.hidden_tag() }}
  <div class="mb-2">{{ form.email.label }} {{ form.email(class="form-control") }}</div>
  <div class="mb-2">{{ form.password.label }} {{ form.password(class="form-control") }}</div>
  <button class="btn btn-primary" type="submit">Login</button>
</form>
{% endblock %}
